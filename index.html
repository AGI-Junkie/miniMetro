<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Mini Metro · 网页复刻</title>
<link rel="stylesheet" href="style.css">
<script defer src="metro.js"></script>
</head>
<body>
<main>
  <canvas id="map" aria-label="地铁线路图"></canvas>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="person" viewBox="0 0 24 24"><circle cx="15" cy="4" r="2.2"/><path d="m14 8-4 6 4 2-2 6m-2-8-3 5H3m10-10 4 5h4M9 9l3-2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="locomotive" viewBox="0 0 24 24"><path d="M4 17V9h4V5h6v6h5v6zM16 8h3v4h-3z"/><circle cx="7" cy="18" r="2"/><circle cx="15" cy="18" r="2"/></symbol>
    <symbol id="carriage" viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M7 10h3m2 0h5" fill="none" stroke="#777" stroke-width="1.5"/><circle cx="8" cy="18" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
    <symbol id="tunnel" viewBox="0 0 24 24"><path d="M5 19v-6a7 7 0 0 1 14 0v6M9 19v-6a3 3 0 0 1 6 0v6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="station" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </svg>
  <header>
    <h1 id="city" class="sr-only">伦敦</h1>
    <div class="stats">
      <span id="score" aria-label="已送达">0</span><svg aria-hidden="true"><use href="#person"/></svg>
      <span id="scenicMeter" role="progressbar" aria-label="下一客运里程碑" aria-valuemin="0" aria-valuemax="100" hidden></span>
      <span id="day">周一</span>
      <div id="clockControls">
        <button id="clock" type="button" aria-label="时间控制" aria-expanded="false" title="时间控制"></button>
        <div id="time" hidden><button id="pause" aria-label="暂停" title="暂停（空格）">Ⅱ</button><button id="normalSpeed" aria-label="正常速度">▶</button><button id="speed" aria-label="双倍速度">▶▶</button></div>
      </div>
    </div>
  </header>
  <footer>
    <p id="hint" aria-live="polite"></p>
    <button id="creativeEdit" aria-pressed="false" hidden>编辑车站</button>
    <button id="toolbarToggle" aria-label="显示或收起工具栏" aria-controls="toolbar" aria-expanded="true" aria-keyshortcuts="ArrowUp ArrowDown"></button>
    <div class="toolbar" id="toolbar">
      <div id="vehicles">
        <button id="train" class="asset" aria-label="增加机车" title="给当前线路增加机车"><svg aria-hidden="true"><use href="#locomotive"/></svg><span id="trainCount"></span></button>
        <button id="car" class="asset" aria-label="增加车厢" title="给当前线路增加车厢"><svg aria-hidden="true"><use href="#carriage"/></svg><span id="carCount"></span></button>
        <button id="interchange" class="asset" aria-label="放置换乘站" title="升级车站容量"><svg aria-hidden="true"><use href="#station"/></svg><span id="interchangeCount"></span></button>
      </div>
      <nav id="lines" aria-label="选择线路">
        <button id="remove" class="asset" aria-label="拆线" title="拆除当前线路" hidden>×</button>
      </nav>
      <div id="crossings" class="asset" aria-label="剩余过河通道" title="剩余过河通道"><svg aria-hidden="true"><use href="#tunnel"/></svg><span id="crossingCount"></span></div>
    </div>
  </footer>
  <button id="menu" class="corner" aria-label="菜单" title="暂停菜单（Esc）">←</button>
  <div id="assetGhost" class="asset" aria-hidden="true" hidden><svg><use href="#locomotive"/></svg></div>
  <dialog id="screen" aria-labelledby="headline">
    <div id="panel">
      <small id="kicker">Mini Metro</small>
      <h2 id="headline">伦敦</h2>
      <p id="description"></p>
      <div id="cityStrip" hidden></div>
      <div id="choices"></div>
      <div id="replay" hidden>
        <button id="replayBack" aria-label="退出路网回放">←</button>
        <div id="replayControls">
          <button id="replayPlay">暂停回放</button><input id="replaySeek" type="range" min="0" value="0" step="1" aria-label="回放位置"><span id="replayTime"></span><button id="replayGif">保存 GIF</button><span id="replayStatus" role="status"></span>
        </div>
      </div>
      <div id="photo" hidden>
        <button id="photoBack" aria-label="退出照片模式">←</button>
        <canvas id="photoPreview" role="img" aria-label="地铁图照片预览"></canvas>
        <div id="photoControls"><button id="photoFrame" aria-pressed="false">城市边框</button><button id="photoSave">保存 PNG</button><span id="photoStatus" role="status"></span></div>
      </div>
      <div id="statistics" hidden>
        <button id="statsBack" aria-label="返回结算">←</button>
        <div id="metrics" aria-label="统计指标"></div>
        <svg id="chart" viewBox="0 0 640 286" role="img" aria-label="本局各日运营趋势，各指标独立缩放"></svg>
      </div>
    </div>
  </dialog>
</main>
</body>
</html>
